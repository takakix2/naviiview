<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Installed as /app/etc/fonts/local.conf (the runtime's 50-flatpak.conf includes it).
  WOFF fonts in the host's /usr/share/fonts/woff (e.g. Debian/Ubuntu fonts-ebgaramond-extra) can send
  WebKitWebProcess into an endless loop in font matching: 100% CPU and a blank window
  (https://bugs.webkit.org/show_bug.cgi?id=325185). Web fonts are not needed by the app, so skip them.
-->
<fontconfig>
  <selectfont>
    <rejectfont>
      <glob>/run/host/fonts/woff/*</glob>
      <glob>/run/host/local-fonts/woff/*</glob>
    </rejectfont>
  </selectfont>
</fontconfig>
