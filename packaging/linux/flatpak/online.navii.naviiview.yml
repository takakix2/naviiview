# Flathub manifest for NaviiView (binary-only: the freeware .deb from GitHub Releases is unpacked into /app).
# Build locally:  flatpak run org.flatpak.Builder --user --install --force-clean build-dir online.navii.naviiview.yml
# Submit: fork github.com/flathub/flathub, branch from new-pr, add this file + the metainfo, open a PR (see docs/linux/DISTRIBUTION.md).
id: online.navii.naviiview
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: naviiview
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # WebKitGTK 2.54 (GNOME 51) shows the previous page for a frame at the end of the page slide when
  # accelerated compositing is on; the deb on the host's WebKitGTK 2.52 does not. Off until it is understood.
  - --env=WEBKIT_DISABLE_COMPOSITING_MODE=1
  # Gamepads (beta): WebKitGTK reads them through libmanette from /dev/input
  - --device=input
  # On a Flatpak that does not know the 'input' device, fall back to all devices
  - --device-if=all:!has-input-device
  - --share=ipc
  # Keep the screen on during a slideshow (org.freedesktop.ScreenSaver.Inhibit / UnInhibit)
  - --talk-name=org.freedesktop.ScreenSaver
  # SMB shares and S3-compatible storage are read by the app itself
  - --share=network
  # Books are read where they are (nothing is copied into the app); settings live under ~/.var/app
  - --filesystem=home:ro
  - --filesystem=/media:ro
  - --filesystem=/run/media:ro
  - --filesystem=/mnt:ro
modules:
  - name: naviiview
    buildsystem: simple
    sources:
      - type: file
        url: https://github.com/takakix2/naviiview/releases/download/v1.1.5/NaviiView_1.1.5_amd64.deb
        sha256: 8591504622413f46407da73d5add4e62ced9de595b6fdfadc26159e9226dd361
        only-arches: [x86_64]
        dest-filename: naviiview.deb
      - type: file
        path: ../online.navii.naviiview.metainfo.xml
      - type: file
        path: fonts-local.conf
    build-commands:
      - ar -x naviiview.deb
      - tar -xf data.tar.gz
      - install -Dm755 usr/bin/naviiview /app/bin/naviiview
      - install -Dm644 usr/share/applications/NaviiView.desktop /app/share/applications/online.navii.naviiview.desktop
      - sed -i 's/^Icon=.*/Icon=online.navii.naviiview/' /app/share/applications/online.navii.naviiview.desktop
      - install -Dm644 usr/share/icons/hicolor/128x128/apps/naviiview.png /app/share/icons/hicolor/128x128/apps/online.navii.naviiview.png
      - install -Dm644 usr/share/icons/hicolor/32x32/apps/naviiview.png /app/share/icons/hicolor/32x32/apps/online.navii.naviiview.png
      - mkdir -p /app/share/metainfo
      - sed 's/NaviiView\.desktop/online.navii.naviiview.desktop/' online.navii.naviiview.metainfo.xml > /app/share/metainfo/online.navii.naviiview.metainfo.xml
      - install -Dm644 fonts-local.conf /app/etc/fonts/local.conf
